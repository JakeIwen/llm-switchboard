# Loaded only by the claude-always-remote tmux server (tmux -L claude-always-remote).
# Keep a dead pane on screen so the supervisor can read its exit status and
# last output before it relaunches the session.
set -g remain-on-exit on
set -g history-limit 20000
set -g mouse on
# Detached windows start wide enough for Claude Code's status line, where
# "/rc active" is shown.
set -g default-size 200x50
set -g window-size latest
set -g status-left "[always-remote] "
set -g status-left-length 20
