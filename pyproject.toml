[project]
name = "llm-switchboard"
version = "0.1.0"
description = "Session supervisor and picker HTTP service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1"]

[tool.uv]
package = false
python-preference = "only-system"
python-downloads = "never"
